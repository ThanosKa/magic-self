name: Deploy

# Puts main on the Cloudflare Worker after CI passes on it.
# "Run workflow" in the Actions tab deploys main by hand and skips the database check.
#
# Needs, in the repo settings: secret CLOUDFLARE_API_TOKEN (Workers edit rights),
# variables CLOUDFLARE_ACCOUNT_ID and the NEXT_PUBLIC_* values below.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Public values that vite build inlines. Worker secrets stay on the Worker.
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout the commit CI passed on
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Database scripts are applied by hand and must land before the code that needs them.
      # Compares with the last successful deploy, so it keeps stopping until a manual run.
      - name: Stop if a database script is waiting
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then last=HEAD~1; fi
          changed=$(git diff --name-only "$last" HEAD -- 'scripts/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Database files changed: $changed. Apply them in Supabase, then press Run workflow to deploy."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Workers
        run: pnpm run build:vinext

      - name: Deploy
        run: pnpm exec cf deploy --prebuilt

      # Switch to https://magic-self.dev/ once the domain is attached to the Worker.
      - name: Check the live site
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://magic-self.kazakis-th.workers.dev/
